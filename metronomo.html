<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrônomo - BPM Global</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">
        <!-- <h1>Editor de Metrônomo</h1> -->

        <div class="controls-wrapper">
            <div class="controls">
                <button id="playBtn" class="play-btn" style="height: 90px; border-radius: 600px;">▶</button>
            </div>
            <div class="global-settings">
                <!-- Novo Input de BPM Global -->
                <label for="globalBpm">BPM</label>
                <input type="number" id="globalBpm" value="120" min="40" max="240">

                <span style="margin: 0 10px; color: #555;">|</span>

                <!-- Repetições da Timeline -->
                <label for="timelineLoop"><i class="fa-solid fa-repeat"
                        title="Repetições da linha do tempo (0 = ∞)"></i></label>
                <input type="number" id="timelineLoop" value="1" min="0">
            </div>
        </div>

        <div class="sections-wrapper">
            <div class="section">
                <h2>Linha do Tempo</h2>
                <div id="timeline" class="timeline">

                    <div class="config-box" draggable="true">
                        <div class="form-group">
                            <label>BPM:</label>
                            <input type="number" class="bpm-input" value="120" min="40" max="240">
                        </div>
                        <div class="form-group">
                            <label>Beats/tick:</label>
                            <input type="number" class="beats-input" value="1" min="1" max="16">
                        </div>
                        <div class="form-group">
                            <label><i class="fa-solid fa-infinity" title="Limite (0 = ∞)"></i></label>
                            <input type="number" class="limit-input" value="4" min="0">
                        </div>
                    </div>

                    <button id="addBlockBtn" class="add-btn">+</button>

                </div>
            </div>
        </div>

        <footer>
            Created By Raphael, O Phoda
        </footer>

    </div>

    <script src="script.js"></script>
</body>

</html>
